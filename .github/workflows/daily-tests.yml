name: Arkiv Voting Board E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  voting-board-e2e:
    runs-on: ubuntu-latest

    env:
      # Pass secrets into the test env
      RPC_URL: ${{ secrets.ARKIV_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.ARKIV_PRIVATE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Show Arkiv SDK version
        run: npm ls @arkiv-network/sdk

      - name: Run Arkiv Voting Board E2E test
        run: npm run test:voting-board
